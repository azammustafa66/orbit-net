spring.application.name=user-service
server.port=8081
server.servlet.context-path=/api/v1/users

# Data source
spring.datasource.url=jdbc:postgresql://localhost:5432/user-service
spring.datasource.username=admin
spring.datasource.password=admin

# JWT
# Dev default only — override with the JWT_SECRET env var (or the config server) in any
# deployed environment, and keep the real secret out of version control.
jwt.secret=${JWT_SECRET:Y6p+WpI6q4wtr9nv0hYcLtUP7p6eoinove/qSeBU1rM=}
jwt.expiration-ms=3600000

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
# Service discovery
eureka.client.service-url.defaultZone=http://localhost:8084/eureka
