spring:
  application:
    name: user-service

  # Data source
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/user-service"
    username: "${DB_USER:admin}"
    password: "${DB_PASSWORD:admin}"
    driver-class-name: org.postgresql.Driver

  # Hibernate
  # Flyway owns the schema now; Hibernate only checks that entities match it.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Schema migrations
  flyway:
    baseline-on-migrate: true
    baseline-version: "1"

  # Kafka
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP:localhost:9092}"
    producer:
      # KafkaTemplate here is keyed by String; the key is currently left null, so this
      # only has to agree with the consumer's key deserializer.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json:
          # The event travels under a logical name rather than this module's class name,
          # so connection-service can map it onto its own package without matching ours.
          type.mapping: userCreated:com.orbitet.event.UserCreatedEvent
  web:
    error:
      # Never leak internals to a caller; stack traces belong in the log, not the response.
      include-stacktrace: never
      include-message: always

server:
  port: 8081
  servlet:
    context-path: /api/v1/users

# JWT
# Signs the tokens api-gateway verifies, so this must stay identical to its jwt.secret.
# No default on purpose: a fallback would let this service boot with a known key and mint
# forgeable tokens, so a missing JWT_SECRET must fail startup.
# Base64 of at least 32 bytes (HS256). Tests supply their own value.
jwt:
  secret: '${JWT_SECRET}'
  expiration-ms: 3600000

# Service discovery
eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8084/eureka}"
