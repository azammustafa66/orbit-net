spring:
  application:
    name: user-service

  # Data source
  datasource:
    url: jdbc:postgresql://localhost:5432/user-service
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  # Hibernate
  # Flyway owns the schema now; Hibernate only checks that entities match it.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Schema migrations
  flyway:
    baseline-on-migrate: true
    baseline-version: "1"

  # Kafka
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # KafkaTemplate here is keyed by String; the key is currently left null, so this
      # only has to agree with the consumer's key deserializer.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json:
          # The event travels under a logical name rather than this module's class name,
          # so connection-service can map it onto its own package without matching ours.
          type.mapping: userCreated:com.orbitet.event.UserCreatedEvent

server:
  port: 8081
  servlet:
    context-path: /api/v1/users

# JWT
# Dev default only — override with the JWT_SECRET env var (or the config server) in any
# deployed environment, and keep the real secret out of version control.
jwt:
  secret: '${JWT_SECRET:Y6p+WpI6q4wtr9nv0hYcLtUP7p6eoinove/qSeBU1rM=}'
  expiration-ms: 3600000

# Service discovery
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8084/eureka
