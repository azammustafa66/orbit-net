# Graph store for connection-service. Only bolt is exposed as a Service; the HTTP browser
# on 7474 is left unpublished, reachable with `kubectl port-forward` when needed.
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: orbit-net
spec:
  selector:
    app: neo4j
  ports:
    - port: 7687
      targetPort: 7687
      name: bolt
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: orbit-net
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5-community
          ports:
            - containerPort: 7687
            - containerPort: 7474
          env:
            # The image takes user and password as one value. connection-service's
            # application.yaml fixes the username at `neo4j`, so only the password varies.
            - name: NEO4J_PASSWORD
              valueFrom: { secretKeyRef: { name: orbit-net-secrets, key: NEO4J_PASSWORD } }
            - name: NEO4J_AUTH
              value: "neo4j/$(NEO4J_PASSWORD)"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            # cypher-shell, not a port check: bolt accepts connections well before the
            # database can answer a query, and connection-service fails in that gap.
            exec:
              command: ["sh", "-c", "cypher-shell -u neo4j -p \"$NEO4J_PASSWORD\" 'RETURN 1' >/dev/null 2>&1"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 15
          livenessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits: { memory: "2Gi" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
