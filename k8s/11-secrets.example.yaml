# Copy to k8s/secrets.yaml, fill in real values, and apply that file. secrets.yaml is
# gitignored; this example is the only version that belongs in the repo.
#
#   cp k8s/11-secrets.example.yaml k8s/secrets.yaml
#   # edit, then:
#   kubectl apply -f k8s/secrets.yaml
#
# stringData takes plain text and Kubernetes base64-encodes it. Base64 is encoding, not
# encryption — anyone who can read the Secret can read the values, so a real cluster wants
# an external secrets store or sealed-secrets rather than a file like this.
apiVersion: v1
kind: Secret
metadata:
  name: orbit-net-secrets
  namespace: orbit-net
type: Opaque
stringData:
  # Must be identical for user-service (which signs tokens) and api-gateway (which verifies
  # them). Base64 of at least 32 bytes: openssl rand -base64 32
  JWT_SECRET: "generate-with-openssl-rand-base64-32"

  # Postgres credentials. The postgres StatefulSet reads the same two keys, so changing
  # them here changes both the server and every client.
  DB_USER: "admin"
  DB_PASSWORD: "choose-a-password"

  NEO4J_PASSWORD: "choose-a-password"

  # uploader-service will not start without real values.
  CLOUDINARY_CLOUD_NAME: "CHANGE_ME"
  CLOUDINARY_API_KEY: "CHANGE_ME"
  CLOUDINARY_API_SECRET: "CHANGE_ME"
