# Single-broker KRaft, mirroring the compose tier. This is the manifest that settles what
# `bootstrap-servers: kafka:9092` in the application-k8s files means: clients bootstrap
# against the `kafka` Service below, and the broker advertises its own stable pod DNS, so
# the address they are redirected to resolves from anywhere in the namespace.
#
# The two-listener split compose needs is unnecessary here — nothing outside the cluster
# talks to Kafka, so there is no second address to advertise.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: orbit-net
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
---
# Headless, for stable per-pod DNS. The KRaft controller quorum needs an address that
# survives rescheduling, which a ClusterIP cannot give it.
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: orbit-net
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - port: 9092
      name: internal
    - port: 9093
      name: controller
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: orbit-net
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka-headless.orbit-net.svc.cluster.local:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: KAFKA_LISTENERS
              value: "INTERNAL://:9092,CONTROLLER://:9093"
            # $(POD_NAME) is expanded by Kubernetes from the env entry above.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNAL://$(POD_NAME).kafka-headless.orbit-net.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"
            # Single-broker sizing. These default to 3; left alone, the consumer offsets
            # topic cannot elect a leader and every consumer stalls.
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: CLUSTER_ID
              value: "kR4ftLocalDevCluster1"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            # Queries the broker's own API versions: succeeds only once it is accepting
            # client connections, which is well after the port opens.
            exec:
              command:
                - sh
                - -c
                - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 15
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits: { memory: "2Gi" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
