spring:
  application:
    name: posts-service
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json:
          # Events travel under a logical name rather than this module's class name, so
          # consumers can map them onto their own package without matching ours.
          type.mapping: postCreated:com.orbitet.events.PostCreated,postLiked:com.orbitet.events.PostLiked

  # Data source
  datasource:
    url: jdbc:postgresql://localhost:5432/posts-service
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  # Hibernate
  # Flyway owns the schema now; Hibernate only checks that entities match it.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Schema migrations
  flyway:
    baseline-on-migrate: true
    baseline-version: "1"

server:
  port: 8080

# Service discovery
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8084/eureka
