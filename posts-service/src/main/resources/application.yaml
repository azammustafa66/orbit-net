spring:
  application:
    name: posts-service
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP:localhost:9092}"
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json:
          # Events travel under a logical name rather than this module's class name, so
          # consumers can map them onto their own package without matching ours.
          type.mapping: postCreated:com.orbitet.events.PostCreated,postLiked:com.orbitet.events.PostLiked

  # Data source
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/posts-service"
    username: "${DB_USER:admin}"
    password: "${DB_PASSWORD:admin}"
    driver-class-name: org.postgresql.Driver

  # Hibernate
  # Flyway owns the schema now; Hibernate only checks that entities match it.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Schema migrations
  flyway:
    baseline-on-migrate: true
    baseline-version: "1"
  web:
    error:
      # Never leak internals to a caller; stack traces belong in the log, not the response.
      include-stacktrace: never
      include-message: always

server:
  port: 8080

# Service discovery
eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8084/eureka}"
