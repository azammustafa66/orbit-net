spring:
  application:
    name: posts-service

  # Data source
  datasource:
    url: jdbc:postgresql://localhost:5432/posts-service
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  # Hibernate
  # Flyway owns the schema now; Hibernate only checks that entities match it.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Schema migrations
  flyway:
    baseline-on-migrate: true
    baseline-version: "1"

server:
  port: 8080

# Service discovery
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8084/eureka
