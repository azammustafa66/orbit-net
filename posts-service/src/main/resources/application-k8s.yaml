# Overrides for the `k8s` profile. Service discovery is Kubernetes DNS here, not Eureka:
# every service in this profile turns the Eureka client off, and discovery-service is not
# deployed to the cluster at all. Anything that used to resolve through Eureka therefore
# has to be given an explicit address below.
eureka:
  client:
    fetch-registry: false
    register-with-eureka: false

spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST}:${DB_PORT}/posts-service"
    username: "${DB_USER}"
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: kafka:9092

# Read by ConnectionServiceClient and UploaderServiceClient. Both default to "", which means
# "resolve through Eureka" — correct outside this profile, and unusable inside it.
CONNECTION_SERVICE_URI: http://connection-service
UPLOADER_SERVICE_URI: http://uploader-service

# Actuator moves to its own port so the probe path is the same for every service. On the
# main port it would sit under server.servlet.context-path, giving each service a different
# probe URL, and it would be reachable through the Ingress alongside the API.
management:
  server:
    port: 9090
  endpoint:
    health:
      probes:
        # Splits /actuator/health into the liveness and readiness groups the probes below use.
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: "health,info"
