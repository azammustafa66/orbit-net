spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Serves /api/v1/users/auth/** (context-path + @RequestMapping("/auth")),
            # so the path is forwarded untouched.
            - id: user-service
              uri: ${USER_SERVICE_URI:lb://USER-SERVICE}
              predicates:
                - Path=/api/v1/users/**

            # posts-service has no context-path and maps /api/v1/core/posts,
            # so rewrite the public path onto the internal one.
            - id: posts-service
              uri: ${POSTS_SERVICE_URI:lb://POSTS-SERVICE}
              predicates:
                - Path=/api/v1/posts/**
              filters:
                # Slash lives inside the capture group so the bare /api/v1/posts
                # rewrites to /api/v1/core/posts, not /api/v1/core/posts/ (Spring 6
                # no longer tolerates the trailing slash).
                - RewritePath=/api/v1/posts(?<segment>.*), /api/v1/core/posts$\{segment}

            # Serves /api/v1/connections/** via context-path, forwarded untouched.
            - id: connection-service
              uri: ${CONNECTION_SERVICE_URI:lb://CONNECTION-SERVICE}
              predicates:
                - Path=/api/v1/connections/**

            # notification-service maps /api/v1/notifications itself, so the path is
            # forwarded untouched.
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URI:lb://NOTIFICATION-SERVICE}
              predicates:
                - Path=/api/v1/notifications/**

            # uploader-service serves /api/v1/file (context-path /api/v1 plus the
            # controller's /file), so the public /upload path is rewritten onto it —
            # same shape as the posts-service route above, and the slash stays inside
            # the capture group for the same reason.
            - id: uploader-service
              uri: ${UPLOADER_SERVICE_URI:lb://UPLOADER-SERVICE}
              predicates:
                - Path=/api/v1/upload/**
              filters:
                - RewritePath=/api/v1/upload(?<segment>.*), /api/v1/file$\{segment}
  web:
    error:
      include-message: always
      include-stacktrace: never

server:
  port: 8083

# JWT
# Must stay identical to user-service's jwt.secret — that service signs the tokens this
# gateway verifies. No default on purpose: a fallback here would let the gateway boot with
# a known key and silently accept forged tokens, so a missing JWT_SECRET must fail startup.
# Base64 of at least 32 bytes (HS256). Tests supply their own value.
jwt:
  secret: '${JWT_SECRET}'

# Eureka Service Discovery
eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8084/eureka}"
