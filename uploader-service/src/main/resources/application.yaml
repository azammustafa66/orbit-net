spring:
  application:
    name: uploader-service
  web:
    error:
      # Never leak internals to a caller; stack traces belong in the log, not the response.
      include-stacktrace: never
      include-message: always

server:
  port: 8086 # canonical port map: uploader-service is 8086 (8085 collided with notification-service)
  # Feign callers reach this service directly through Eureka, not via api-gateway, so the
  # /api/v1 prefix they use has to be served here rather than added by a gateway rewrite.
  servlet:
    context-path: /api/v1

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# Service discovery
eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8084/eureka}"
