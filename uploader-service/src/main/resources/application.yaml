spring:
  application:
    name: uploader-service

server:
  port: 8085

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# Service discovery
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8084/eureka


